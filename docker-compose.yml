# One command: docker compose up --build
# Then open http://localhost:8080
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: certiflow
      POSTGRES_PASSWORD: certiflow
      POSTGRES_DB: certiflow
    ports: ["5433:5432"]  # host port 5433 avoids clashing with a local Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certiflow"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # API server. Applies migrations and seeds demo users on start.
  backend:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: postgresql://certiflow:certiflow@postgres:5432/certiflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-real-deployments}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      ESCALATION_MINUTES: ${ESCALATION_MINUTES:-1440}
      WA_FAIL_RATE: ${WA_FAIL_RATE:-0.2}
      WA_TIMEOUT_RATE: ${WA_TIMEOUT_RATE:-0.1}
      WA_MAX_ATTEMPTS: ${WA_MAX_ATTEMPTS:-6}
      WA_BACKOFF_MS: ${WA_BACKOFF_MS:-1000}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-20}
      RATE_LIMIT_PUBLIC: ${RATE_LIMIT_PUBLIC:-120}
      RATE_LIMIT_API: ${RATE_LIMIT_API:-600}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["4000:4000"]

  # Background worker: issues certificates, sends WhatsApp, escalates stuck batches.
  # Same image as the backend, different command. Run more copies to scale.
  worker:
    build: ./backend
    command: ["npx", "tsx", "src/worker.ts"]
    environment: *backend-env
    depends_on:
      backend: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  pgdata:
